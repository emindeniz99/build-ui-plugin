# Supply-chain policy: install no version published less than 7 days ago
# (10080 minutes), refuse a version whose publish time is unknown, and refuse
# one published with weaker trust evidence than its predecessors.
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade

# The lab serves node_modules to the browser through one flat import map, so
# every package (including sub-dependencies such as lit-html) must sit at the top.
nodeLinker: hoisted

allowBuilds:
  esbuild: false
