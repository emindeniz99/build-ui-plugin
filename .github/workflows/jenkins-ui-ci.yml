name: jenkins-ui CI

# Actions are pinned to full commit SHAs (graduation rule, lesson 10). The
# release age of these SHAs was not checked when they were pinned.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "projects/jenkins-ui/**"
      - ".github/workflows/jenkins-ui-ci.yml"
  pull_request:
    paths:
      - "projects/jenkins-ui/**"
      - ".github/workflows/jenkins-ui-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/jenkins-ui

jobs:
  plugin:
    name: plugin (Jenkins ${{ matrix.line }}, Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum line on the lowest Java it supports, and the current LTS line.
          - { line: "2.541", version: "2.541.1", bom: "7002.v028a_3607ddc8", java: "17" }
          - { line: "2.580", version: "2.580.1", bom: "7237.v5071b_f4589f1", java: "21" }
    env:
      JENKINS_LINE: ${{ matrix.line }}
      JENKINS_VERSION: ${{ matrix.version }}
      BOM_VERSION: ${{ matrix.bom }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build, test, SpotBugs
        run: mvn -B -ntp -Djenkins.baseline="$JENKINS_LINE" -Djenkins.version="$JENKINS_VERSION" -Dbom.version="$BOM_VERSION" verify

  runtimes:
    name: runtime bundles, checker and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No `version` input: the action reads packageManager from js/package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: projects/jenkins-ui/js/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - run: pnpm --dir js install --frozen-lockfile
      - run: pnpm --dir js vendor:check
      - run: pnpm --dir js test
      - run: pnpm --dir js check ../examples/*.Jenkinsfile

  e2e:
    name: browser (Jenkins ${{ matrix.line }})
    needs: [plugin, runtimes]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { line: "2.541", version: "2.541.1", bom: "7002.v028a_3607ddc8" }
          - { line: "2.580", version: "2.580.1", bom: "7237.v5071b_f4589f1" }
    env:
      JENKINS_LINE: ${{ matrix.line }}
      JENKINS_VERSION: ${{ matrix.version }}
      BOM_VERSION: ${{ matrix.bom }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: projects/jenkins-ui/js/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - run: pnpm --dir js install --frozen-lockfile
      - run: pnpm --dir js exec playwright install --with-deps chromium
      - name: Start Jenkins with the plugin (development mode enforces CSP)
        run: |
          mvn -B -ntp -Djenkins.baseline="$JENKINS_LINE" -Djenkins.version="$JENKINS_VERSION" -Dbom.version="$BOM_VERSION" \
            hpi:run -Dport=8080 -Dhost=127.0.0.1 -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true > hpi-run.log 2>&1 &
          for _ in $(seq 1 300); do
            grep -q "Jenkins is fully up" hpi-run.log && exit 0
            grep -q "BUILD FAILURE" hpi-run.log && break
            sleep 2
          done
          tail -100 hpi-run.log
          exit 1
      - run: pnpm --dir js e2e
      - name: Jenkins log
        if: failure()
        run: tail -200 hpi-run.log
