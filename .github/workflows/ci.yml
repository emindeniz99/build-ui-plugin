name: CI

# Actions are pinned to full commit SHAs so a moved tag cannot change
# what runs. The
# release age of these SHAs was not checked when they were pinned.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    name: plugin (Jenkins ${{ matrix.line }}, Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum line on the lowest Java it supports, and the current LTS line.
          # The minimum line sets no versions: it builds pom.xml's own
          # jenkins.version and bom.version, so a Dependabot bump of either is
          # built on its PR. Keep its `line` label equal to pom.xml's
          # jenkins.baseline. The current-LTS versions are bumped here by hand.
          - { line: "2.541", java: "17" }
          - { line: "2.580", version: "2.580.1", bom: "7237.v5071b_f4589f1", java: "21" }
    env:
      JENKINS_LINE: ${{ matrix.line }}
      JENKINS_VERSION: ${{ matrix.version }}
      BOM_VERSION: ${{ matrix.bom }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build, test, SpotBugs
        run: |
          versions=()
          if [ -n "$BOM_VERSION" ]; then
            versions=(-Djenkins.baseline="$JENKINS_LINE" -Djenkins.version="$JENKINS_VERSION" -Dbom.version="$BOM_VERSION")
          fi
          mvn -B -ntp "${versions[@]}" verify

  runtimes:
    name: runtime bundles, checker and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No `version` input: the action reads packageManager from js/package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: js/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - run: pnpm --dir js install --frozen-lockfile
      - run: pnpm --dir js vendor:check
      - run: pnpm --dir js test
      # The shell expands the glob here in .; the checker
      # resolves the paths against INIT_CWD, the directory pnpm ran from.
      - run: pnpm --dir js check examples/*.Jenkinsfile

  e2e:
    name: browser (Jenkins ${{ matrix.line }}, ${{ matrix.browsers }})
    needs: [plugin, runtimes]
    # Playwright 1.56.1 has no browser builds for Ubuntu 26.04, which
    # ubuntu-latest ran on 2026-10-27. Move with the Playwright version.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every engine on the current LTS line; Chromium alone on the minimum
          # line, which builds on pom.xml's versions as in the plugin job.
          - { line: "2.541", browsers: "chromium" }
          - { line: "2.580", version: "2.580.1", bom: "7237.v5071b_f4589f1", browsers: "chromium,firefox,webkit" }
    env:
      JENKINS_LINE: ${{ matrix.line }}
      JENKINS_VERSION: ${{ matrix.version }}
      BOM_VERSION: ${{ matrix.bom }}
      BROWSERS: ${{ matrix.browsers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: js/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - run: pnpm --dir js install --frozen-lockfile
      - run: pnpm --dir js exec playwright install --with-deps ${BROWSERS//,/ }
      - name: Start Jenkins with the plugin (development mode enforces CSP)
        run: |
          versions=()
          if [ -n "$BOM_VERSION" ]; then
            versions=(-Djenkins.baseline="$JENKINS_LINE" -Djenkins.version="$JENKINS_VERSION" -Dbom.version="$BOM_VERSION")
          fi
          mvn -B -ntp "${versions[@]}" \
            hpi:run -Dport=8080 -Dhost=127.0.0.1 -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true > hpi-run.log 2>&1 &
          for _ in $(seq 1 300); do
            grep -q "Jenkins is fully up" hpi-run.log && exit 0
            grep -q "BUILD FAILURE" hpi-run.log && break
            sleep 2
          done
          tail -100 hpi-run.log
          exit 1
      # Engine facts behind docs/design.md sections 12 and 13, measured on the
      # same browser builds as the suite. Firefox and WebKit run nowhere else.
      - name: Browser probes (sandboxed frame, eval runtimes)
        run: |
          for browser in ${BROWSERS//,/ }; do
            node js/lab/sandbox-probe.mjs "$browser"
            node js/lab/eval-runtime-probe.mjs "$browser"
          done
      - run: pnpm --dir js e2e
      - name: Playwright traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ matrix.line }}
          path: js/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Jenkins log
        if: failure()
        run: test -f hpi-run.log && tail -200 hpi-run.log || echo "Jenkins did not start; no hpi-run.log"
