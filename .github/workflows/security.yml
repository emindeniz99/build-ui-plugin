name: security

# Lints the workflows (zizmor) and scans the history for secrets (gitleaks).
# Actions pinned by SHA, read-only token, no persisted credentials. zizmor is pinned by wheel hash; gitleaks by Go module
# version, which sum.golang.org checks. Both were older than 7 days when
# pinned (zizmor 1.31.1: 2026-10-15, gitleaks v8.30.1: 2026-02-21).

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  zizmor:
    name: workflow lint (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor 1.31.1
        run: |
          echo "zizmor==1.31.1 --hash=sha256:58e878eb2dbd2c6183c105e1ac28c14f7dd1eca44a783f1fe2a69647d012c410" > "$RUNNER_TEMP/zizmor.txt"
          python3 -m pip install --user --require-hashes --only-binary :all: -r "$RUNNER_TEMP/zizmor.txt"
      - run: ~/.local/bin/zizmor --offline .github/workflows/

  gitleaks:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: >-
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 git
          --redact --exit-code 1
          .
