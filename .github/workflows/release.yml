name: release

# release-please.yml starts this workflow at the tag it creates when a
# release pull request merges. A v<version> tag pushed by hand starts it
# too. The job builds the plugin at that version, runs its tests, and
# attaches build-ui.hpi and its checksum to the tag's GitHub Release,
# creating the Release if release-please did not. The .hpi never goes
# into git. release-please.yml dispatches this file by name: rename both
# together.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    env:
      TAG: ${{ github.ref_name }}
      REF_TYPE: ${{ github.ref_type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Read the version from the tag
        run: |
          if [ "$REF_TYPE" != tag ]; then
            echo "run this workflow at a tag, not the branch $TAG" >&2
            exit 1
          fi
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag $TAG is not v<major>.<minor>.<patch>" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build and test at that version
        run: |
          mvn -B -ntp versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn -B -ntp verify
      # Run in target/ so the file names build-ui.hpi as it is downloaded,
      # and `sha256sum -c build-ui.hpi.sha256` works next to the asset.
      - name: Write the checksum
        working-directory: target
        run: sha256sum build-ui.hpi | tee build-ui.hpi.sha256
      - name: Attach the plugin to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "build-ui $VERSION" --notes "See CHANGELOG.md."
          fi
          gh release upload "$TAG" target/build-ui.hpi target/build-ui.hpi.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
