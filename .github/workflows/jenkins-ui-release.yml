name: jenkins-ui release

# Push a tag named jenkins-ui-v<version> (for example jenkins-ui-v0.1.0) on a
# commit of main. The job builds the plugin at that version, runs its tests,
# and attaches build-ui.hpi to a GitHub Release. The .hpi never goes into git.

on:
  push:
    tags: ["jenkins-ui-v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    defaults:
      run:
        working-directory: projects/jenkins-ui
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Read the version from the tag
        run: |
          version="${TAG#jenkins-ui-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag $TAG is not jenkins-ui-v<major>.<minor>.<patch>" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build and test at that version
        run: |
          mvn -B -ntp versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn -B -ntp verify
      # Run in target/ so the file names build-ui.hpi as it is downloaded,
      # and `sha256sum -c build-ui.hpi.sha256` works next to the asset.
      - name: Write the checksum
        working-directory: projects/jenkins-ui/target
        run: sha256sum build-ui.hpi | tee build-ui.hpi.sha256
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" target/build-ui.hpi target/build-ui.hpi.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "build-ui $VERSION" --notes-file CHANGELOG.md
